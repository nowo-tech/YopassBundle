# UiKit page contract (REQ-UI-003): one host layout pair and one theme for every bundle page. REQ-DEMO-014: UiKit's
# default theme, unchanged, with UiKit's own semantic stylesheet only (no CSS framework, no CDN); the demo layouts
# extend UiKit's admin and guest layouts.
nowo_ui_kit:
    css_framework: custom
    icon_set: svg_inline
    row_actions_display: icon
    layouts:
        admin: 'layouts/admin.html.twig'
        guest: 'layouts/guest.html.twig'
