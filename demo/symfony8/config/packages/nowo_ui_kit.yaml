# UiKit page contract (REQ-UI-003): one host layout pair and one theme for every bundle page. The demo layouts extend
# base.html.twig (Tabler + Tabler Icons from the demo app) to match css_framework / icon_set; the Yopass pages bring
# no layout, no CSS framework and no CDN of their own.
nowo_ui_kit:
    css_framework: tabler
    icon_set: tabler-icons
    row_actions_display: icon
    layouts:
        admin: 'layouts/admin.html.twig'
        guest: 'layouts/guest.html.twig'
