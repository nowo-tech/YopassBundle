# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.1 (exclusions for incompatible pairs; composer.json requires ^7.4 || ^8.0).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master, 1.x]
  pull_request:
    branches: [main, master, 1.x]

# Superseded PR runs are cancelled. Push runs (main/master) get their own group (run_id), so a main run is never
# cancelled, not even while pending: tag_when_green.sh needs a completed run on every release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Light mode (docs/GITHUB_CI.md#light-mode-for-deps-and-docs-only-prs): one representative cell plus the cheap
  # gates. The org (or repo) Actions variable NOWO_CI_PR_MODE picks the PR mode: light = every PR light; full = every
  # PR full; auto / unset = light only when the PR touches nothing but composer.json / composer.lock (root or demo),
  # docs/**, *.md, .github/ISSUE_TEMPLATE/**, specs/** or .cursor/**. push, tags, workflow_dispatch and schedule are
  # always full. Fail-closed: any error, unknown value or empty output means full (jobs reduce only on 'light').
  changes:
    name: Change scope (light or full)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout code (PR merge commit and its base parent)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.NOWO_CI_PR_MODE }}
          LIGHT: '^((demo/([^/]+/)?)?composer\.(json|lock)|docs/.*|specs/.*|\.cursor/.*|\.github/ISSUE_TEMPLATE/.*|.*\.md)$'
        run: |
          mode=full; paths=""
          if [ "$EVENT" != pull_request ]; then
            reason="event '$EVENT' always runs full"
          else
            case "$SWITCH" in
              light) mode=light; reason="NOWO_CI_PR_MODE=light: every PR is light" ;;
              full) reason="NOWO_CI_PR_MODE=full: every PR is full" ;;
              ''|auto)
                if files=$(git diff --name-only --no-renames HEAD^1 HEAD); then
                  mode=light; reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): only deps/docs paths changed"
                  while IFS= read -r f; do
                    [ -n "$f" ] || continue
                    if ! printf '%s\n' "$f" | grep -Eq "$LIGHT"; then mode=full; paths="$paths $f"; fi
                  done <<< "$files"
                  [ "$mode" = light ] || reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): non deps/docs paths changed:$paths"
                else
                  reason="NOWO_CI_PR_MODE=${SWITCH:-unset} (auto): git diff failed, fail-closed"
                fi ;;
              *) reason="NOWO_CI_PR_MODE='$SWITCH' is not light/auto/full, fail-closed" ;;
            esac
          fi
          echo "mode=$mode ($reason)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "### CI mode: \`$mode\`"
            echo ""
            echo "$reason"
            if [ "$EVENT" = pull_request ] && [ -n "${files:-}" ]; then echo ""; echo "Changed paths:"; echo '```'; echo "$files" | head -200; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    # Never skipped at job level (required matrix contexts). Light mode: only PHP 8.5 - Symfony 8.1 does the work.
    needs: changes
    if: ${{ !cancelled() }}
    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' || (matrix.php == '8.5' && matrix.symfony == '8.1') }}
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Light mode (deps/docs-only PR) - covered by PHP 8.5 - Symfony 8.1
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - name: Checkout code
        if: env.HEAVY == 'true'
        uses: actions/checkout@v7

      - name: Setup PHP
        if: env.HEAVY == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, sodium
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        if: env.HEAVY == 'true'
        run: composer validate --strict

      - name: Get Composer cache directory
        if: env.HEAVY == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: env.HEAVY == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        if: env.HEAVY == 'true'
        run: composer config platform.php "${{ matrix.php }}.99"

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        if: env.HEAVY == 'true'
        run: |
          SYMFONY="${{ matrix.symfony }}"
          SYMFONY_MAJOR="${SYMFONY%%.*}"
          if [ "$SYMFONY_MAJOR" -ge 8 ]; then
            DOCTRINE_BUNDLE="^3.0"
          else
            DOCTRINE_BUNDLE="^2.10"
          fi
          echo "Using doctrine/doctrine-bundle ${DOCTRINE_BUNDLE} with Symfony ^${SYMFONY}"
          composer require \
            symfony/config:^${SYMFONY} \
            symfony/dependency-injection:^${SYMFONY} \
            symfony/form:^${SYMFONY} \
            symfony/framework-bundle:^${SYMFONY} \
            symfony/http-kernel:^${SYMFONY} \
            symfony/routing:^${SYMFONY} \
            symfony/security-bundle:^${SYMFONY} \
            symfony/translation:^${SYMFONY} \
            symfony/twig-bundle:^${SYMFONY} \
            symfony/validator:^${SYMFONY} \
            symfony/yaml:^${SYMFONY} \
            doctrine/doctrine-bundle:${DOCTRINE_BUNDLE} \
            --no-interaction --no-update
          composer update symfony/* doctrine/* --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests
        if: env.HEAVY == 'true'
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: env.HEAVY == 'true' && matrix.php == '8.2' && matrix.symfony == '7.4'
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- '*.php')" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u -- '*.php'
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, which branch protection accepts).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    # 1.22.0: the MongoDB ODM private document manager is covered on a real server (no coverage exclusion).
    services:
      mongo:
        # MongoDB 8.x / 9.0 refuse to start on Linux 6.19+ (SERVER-121912), the hosted runner kernel.
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YOPASS_TEST_MONGODB_URL: mongodb://127.0.0.1:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sodium, mongodb
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require symfony/config:^7.4 symfony/dependency-injection:^7.4 symfony/form:^7.4 symfony/framework-bundle:^7.4 symfony/http-foundation:^7.4 symfony/http-kernel:^7.4 symfony/routing:^7.4 symfony/twig-bundle:^7.4 symfony/web-profiler-bundle:^7.4 doctrine/doctrine-bundle:^2.10 --no-interaction --no-update
          composer update symfony/* doctrine/* --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage (100% statements gate)..."
          rm -rf .phpunit.cache
          composer test-coverage-100
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "✅ coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sodium
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer phpstan

  igor:
    name: Igor (FrankenPHP worker state)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, which branch protection accepts).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sodium
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  # REQ-RUNTIME-003 + LQ-Y-L1: id mapping (binary collation, post-filters) and the two-connection concurrency tests
  # (one-time reveal, extend, purge; tests/Integration/Database) on real servers, DBAL 3 and 4. None may be skipped.
  database:
    name: Databases on ${{ matrix.database.name }} - DBAL ${{ matrix.dbal }}
    runs-on: ubuntu-latest
    # Never skipped at job level (matrix contexts). Light mode: every cell passes after one echo step, no service image is pulled.
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        dbal: ['3', '4']
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            url: mysql://root@127.0.0.1:3306/yopass_test?serverVersion=8.4.0&charset=utf8mb4
          - name: MariaDB 11.4
            image: mariadb:11.4
            url: mysql://root@127.0.0.1:3306/yopass_test?serverVersion=11.4.0-MariaDB&charset=utf8mb4
          - name: PostgreSQL 16
            image: postgres:16
            url: postgresql://postgres@127.0.0.1:5432/yopass_test?serverVersion=16&charset=utf8
          - name: PostgreSQL 17
            image: postgres:17
            url: postgresql://postgres@127.0.0.1:5432/yopass_test?serverVersion=17&charset=utf8
    services:
      database:
        image: ${{ needs.changes.outputs.mode != 'light' && matrix.database.image || '' }}
        # Throwaway CI databases without passwords (GitGuardian: no credential in the workflow).
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: yopass_test
          MARIADB_DATABASE: yopass_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: yopass_test
        ports:
          - 3306:3306
          - 5432:5432
    env:
      HEAVY: ${{ needs.changes.outputs.mode != 'light' }}
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb
      YOPASS_TEST_DATABASE_URL: ${{ matrix.database.url }}

    steps:
      - name: Light mode (deps/docs-only PR) - no database run
        if: env.HEAVY != 'true'
        run: echo "Light mode, this cell has nothing to do."

      - uses: actions/checkout@v7
        if: env.HEAVY == 'true'

      - uses: shivammathur/setup-php@v2
        if: env.HEAVY == 'true'
        with:
          php-version: '8.2'
          extensions: json, sodium, pdo_mysql, pdo_pgsql
          tools: composer:v2

      - name: Install dependencies (DBAL ${{ matrix.dbal }})
        if: env.HEAVY == 'true'
        run: |
          composer require doctrine/dbal:^${{ matrix.dbal }} --no-interaction --no-update
          composer update doctrine/* --with-all-dependencies --prefer-dist --no-progress --no-interaction
          composer show 'doctrine/dbal'; composer show 'doctrine/orm'

      - name: Wait for the database
        if: env.HEAVY == 'true'
        run: |
          php -r 'require "vendor/autoload.php";
            $params = (new Doctrine\DBAL\Tools\DsnParser(["mysql" => "pdo_mysql", "postgresql" => "pdo_pgsql"]))->parse(getenv("YOPASS_TEST_DATABASE_URL"));
            for ($i = 0; $i < 60; ++$i) {
                try { Doctrine\DBAL\DriverManager::getConnection($params)->executeQuery("SELECT 1"); exit(0); } catch (Throwable) { sleep(2); }
            }
            exit(1);'

      - name: Id mapping and concurrency tests (LQ-Y-L1, REQ-RUNTIME-003)
        if: env.HEAVY == 'true'
        timeout-minutes: 10
        run: vendor/bin/phpunit --group database --no-coverage --fail-on-skipped

  # The bundle must work with the lowest nowo-tech/transaction-* versions its composer.json allows (hosts and demos
  # can run `composer update nowo-tech/yopass-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and the demo
  # fails with "class not found").
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, sodium
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer config platform.php 8.4.1
          composer update --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Unit and integration suites at the floor
        timeout-minutes: 10
        run: vendor/bin/phpunit --no-coverage --testsuite unit,integration

  mongodb:
    name: MongoDB round trip
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, which branch protection accepts).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}
    services:
      mongo:
        # MongoDB 8.x / 9.0 refuse to start on Linux 6.19+ (SERVER-121912), the hosted runner kernel.
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YOPASS_TEST_MONGODB_URL: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sodium, mongodb
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/phpunit tests/Integration/Mongo --fail-on-skipped

  typescript:
    name: Vitest + tsc (TypeScript)
    runs-on: ubuntu-latest
    # Light mode: skipped (a skipped non-matrix job reports its own name as skipped, which branch protection accepts).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.mode != 'light' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - name: Type-check (tsc --noEmit)
        run: pnpm run typecheck
      - run: pnpm run test:coverage

  security-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    env:
      COMPOSER_IGNORE_PLATFORM_REQ: ext-mongodb

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer audit

  git-hygiene:
    name: Git hygiene (REQ-GIT-001)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD
