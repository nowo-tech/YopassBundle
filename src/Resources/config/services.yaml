# Bundle service definitions. Parameters are set by YopassExtension from config/packages/nowo_yopass.yaml.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Auto-register bundle classes (controllers, services, listeners) except excluded paths.
    Nowo\YopassBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../YopassBundle.php'
            - '../../Repository/'   # Registered explicitly by driver (ORM, MongoDB, custom)
            - '../../Document/'
            - '../../Doctrine/'     # Metadata listeners wired in YopassExtension
            - '../../Security/PublicEndpointRateLimiter.php'
            - '../../Controller/'

    # Manage and public controllers must be public for Symfony routing.
    # REQ-SF-004 rule 7: controllers are registered explicitly, NOT autoconfigured (no #[AsController]). On
    # Symfony >= 7.3 a #[Route] class is autoconfigured with the routing.controller tag and the host's
    # `routing.controllers` resource would expose /tools/yopass/... and the anonymous /share/{id} endpoints without
    # the nowo_yopass route loader (bypassing the configured routes, route_prefix and web_ui.enabled: false).
    Nowo\YopassBundle\Controller\:
        resource: '../../Controller/'
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    # Loads routes from nowo_yopass.routes and nowo_yopass.route_prefix parameters; only the public routes when
    # nowo_yopass.web_ui.enabled is false (REQ-SEC-004 L2).
    Nowo\YopassBundle\Routing\YopassRouteLoader:
        arguments:
            $routes: '%nowo_yopass.routes%'
            $routePrefix: '%nowo_yopass.route_prefix%'
            $webUiEnabled: '%nowo_yopass.web_ui.enabled%'
        tags:
            - { name: routing.loader }

    # REQ-SEC-004 M1: redirects legacy /share/{id}?decrypt_key=… links to the #decrypt_key= fragment before routing,
    # so the key is not reflected, logged by the router or kept in the browser history.
    Nowo\YopassBundle\EventListener\ShareKeyQueryRedirectListener:
        arguments:
            $routes: '%nowo_yopass.routes%'
            $routePrefix: '%nowo_yopass.route_prefix%'

    Nowo\YopassBundle\Service\ShareCreator:
        arguments:
            # Allowed expiration ids/intervals from nowo_yopass.shares.expiration_options.
            $expirationOptions: '%nowo_yopass.expiration_options%'

    Nowo\YopassBundle\Service\ShareExtender:
        arguments:
            $shareOptions: '%nowo_yopass.shares%'

    Nowo\YopassBundle\Service\ShareAccessLogger:
        arguments:
            $enabled: '%nowo_yopass.access_log_enabled%'

    Nowo\YopassBundle\Service\ShareRetentionPurger:
        arguments:
            $shareOptions: '%nowo_yopass.shares%'

    # Authenticated manage UI and create API. File handler alias is wired by ShareFileHandlerPass.
    Nowo\YopassBundle\Controller\ShareManageController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_yopass.routes%'
            $maxCiphertextBytes: '%nowo_yopass.max_ciphertext_bytes%'
            $maxSecretChars: '%nowo_yopass.max_secret_chars%'
            $dashboardRoute: '%nowo_yopass.dashboard_route%'
            $shareOptions: '%nowo_yopass.shares%'
            $sharingOptions: '%nowo_yopass.sharing%'
            $fileSharesEnabled: '%nowo_yopass.file_shares_enabled%'
            $fileHandler: null  # Set at compile time when nowo_yopass.file_handler is configured

    # Anonymous public reveal and consume endpoints (ciphertext only; decryption in browser).
    Nowo\YopassBundle\Controller\PublicShareController:
        public: true
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        arguments:
            $routes: '%nowo_yopass.routes%'

    # Deprecated since 1.10 (REQ-UI-003: pages read nowo_ui_layout / nowo_ui_kit): 1.x Twig globals kept for host
    # template overrides written for 1.x; removed in 2.0.
    Nowo\YopassBundle\Twig\YopassTwigExtension:
        arguments:
            $layoutTemplate: '%nowo_yopass.web_ui.layout_template%'
            $cssFramework: '%nowo_yopass.web_ui.css_framework%'
            $iconSet: '%nowo_yopass.web_ui.icon_set%'

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\YopassBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']
